<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>K12 评测题库</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0f12;
    --surface: #151820;
    --border: #1e2330;
    --accent: #4ade80;
    --accent-dim: rgba(74, 222, 128, 0.12);
    --text: #e2e8f0;
    --text-dim: #64748b;
    --tag-bg: #1a2035;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Serif SC', serif;
    min-height: 100vh;
  }

  /* ── Header ── */
  header {
    border-bottom: 1px solid var(--border);
    padding: 2rem 3rem;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 1rem;
  }

  .logo {
    display: flex;
    flex-direction: column;
    gap: 0.25rem;
  }

  .logo-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.65rem;
    letter-spacing: 0.2em;
    color: var(--accent);
    text-transform: uppercase;
  }

  .logo-title {
    font-size: 1.6rem;
    font-weight: 700;
    letter-spacing: -0.02em;
    color: var(--text);
  }

  .meta {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.75rem;
    color: var(--text-dim);
    text-align: right;
    line-height: 1.8;
  }

  .meta span {
    color: var(--accent);
  }

  /* ── Filter Bar ── */
  .filter-section {
    padding: 1.5rem 3rem;
    border-bottom: 1px solid var(--border);
    display: flex;
    flex-wrap: wrap;
    gap: 1.5rem;
    align-items: flex-end;
  }

  .filter-group {
    display: flex;
    flex-direction: column;
    gap: 0.4rem;
  }

  .filter-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.6rem;
    letter-spacing: 0.15em;
    color: var(--text-dim);
    text-transform: uppercase;
  }

  .filter-pills {
    display: flex;
    gap: 0.4rem;
    flex-wrap: wrap;
  }

  .pill {
    padding: 0.3rem 0.8rem;
    border-radius: 2px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-dim);
    font-size: 0.8rem;
    cursor: pointer;
    transition: all 0.15s;
    font-family: 'Noto Serif SC', serif;
    white-space: nowrap;
  }

  .pill:hover {
    border-color: var(--accent);
    color: var(--text);
  }

  .pill.active {
    border-color: var(--accent);
    background: var(--accent-dim);
    color: var(--accent);
  }

  .search-wrap {
    flex: 1;
    min-width: 200px;
  }

  .search-input {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 2px;
    padding: 0.35rem 0.8rem;
    color: var(--text);
    font-size: 0.85rem;
    font-family: 'Noto Serif SC', serif;
    outline: none;
    transition: border-color 0.15s;
  }

  .search-input:focus { border-color: var(--accent); }
  .search-input::placeholder { color: var(--text-dim); }

  /* ── Results Bar ── */
  .results-bar {
    padding: 0.75rem 3rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.72rem;
    color: var(--text-dim);
    border-bottom: 1px solid var(--border);
  }

  .results-count span { color: var(--accent); }

  /* ── Card Grid ── */
  .grid {
    padding: 2rem 3rem;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
    gap: 1px;
    background: var(--border);
  }

  .card {
    background: var(--bg);
    padding: 1.5rem;
    display: flex;
    flex-direction: column;
    gap: 1rem;
    transition: background 0.15s;
    cursor: pointer;
    position: relative;
  }

  .card:hover { background: var(--surface); }

  .card::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 2px;
    background: transparent;
    transition: background 0.15s;
  }

  .card:hover::before { background: var(--accent); }

  .card-id {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.6rem;
    color: var(--text-dim);
    letter-spacing: 0.1em;
  }

  .card-prompt {
    font-size: 0.9rem;
    line-height: 1.7;
    color: var(--text);
    display: -webkit-box;
    -webkit-line-clamp: 4;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .card-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 0.4rem;
    margin-top: auto;
  }

  .tag {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.65rem;
    padding: 0.15rem 0.5rem;
    border-radius: 2px;
    background: var(--tag-bg);
    color: var(--text-dim);
    letter-spacing: 0.05em;
  }

  .tag.subject { color: #60a5fa; border: 1px solid rgba(96,165,250,0.2); }
  .tag.ability { color: #a78bfa; border: 1px solid rgba(167,139,250,0.2); }
  .tag.grade   { color: #fb923c; border: 1px solid rgba(251,146,60,0.2); }
  .tag.risk-sensitive { color: #f87171; border: 1px solid rgba(248,113,113,0.2); }
  .tag.risk-normal { color: var(--text-dim); border: 1px solid var(--border); }

  /* ── Modal ── */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    backdrop-filter: blur(4px);
    z-index: 100;
    align-items: center;
    justify-content: center;
    padding: 2rem;
  }

  .modal-overlay.open { display: flex; }

  .modal {
    background: var(--surface);
    border: 1px solid var(--border);
    max-width: 680px;
    width: 100%;
    max-height: 80vh;
    overflow-y: auto;
    border-radius: 2px;
    padding: 2rem;
    display: flex;
    flex-direction: column;
    gap: 1.5rem;
    position: relative;
  }

  .modal-close {
    position: absolute;
    top: 1rem; right: 1rem;
    background: none;
    border: none;
    color: var(--text-dim);
    font-size: 1.2rem;
    cursor: pointer;
    line-height: 1;
    padding: 0.25rem;
  }

  .modal-close:hover { color: var(--text); }

  .modal-id {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.65rem;
    color: var(--accent);
    letter-spacing: 0.1em;
  }

  .modal-prompt {
    font-size: 1rem;
    line-height: 1.8;
    color: var(--text);
    border-left: 2px solid var(--accent);
    padding-left: 1rem;
  }

  .modal-meta {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 0.75rem;
  }

  .modal-meta-item {
    display: flex;
    flex-direction: column;
    gap: 0.2rem;
  }

  .modal-meta-key {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.6rem;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.1em;
  }

  .modal-meta-val {
    font-size: 0.85rem;
    color: var(--text);
  }

  /* ── Empty / Loading ── */
  .state-msg {
    padding: 4rem 3rem;
    text-align: center;
    color: var(--text-dim);
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.8rem;
  }

  .state-msg .dot {
    display: inline-block;
    animation: blink 1s infinite;
  }
  .state-msg .dot:nth-child(2) { animation-delay: 0.2s; }
  .state-msg .dot:nth-child(3) { animation-delay: 0.4s; }

  @keyframes blink {
    0%, 80%, 100% { opacity: 0.2; }
    40% { opacity: 1; }
  }

  @media (max-width: 640px) {
    header, .filter-section, .results-bar, .grid, .state-msg { padding-left: 1.25rem; padding-right: 1.25rem; }
    .grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">
    <span class="logo-label">K12 · Eval · Database</span>
    <span class="logo-title">评测题库</span>
  </div>
  <div class="meta">
    最后更新 <span id="lastUpdate">—</span><br>
    题目总数 <span id="totalCount">—</span> 条
  </div>
</header>

<div class="filter-section">
  <div class="filter-group">
    <span class="filter-label">学科</span>
    <div class="filter-pills" id="subjectFilters"></div>
  </div>
  <div class="filter-group">
    <span class="filter-label">能力类型</span>
    <div class="filter-pills" id="abilityFilters"></div>
  </div>
  <div class="filter-group">
    <span class="filter-label">年级段</span>
    <div class="filter-pills" id="gradeFilters"></div>
  </div>
  <div class="filter-group search-wrap">
    <span class="filter-label">关键词搜索</span>
    <input class="search-input" id="searchInput" placeholder="输入关键词..." type="text">
  </div>
</div>

<div class="results-bar">
  <div class="results-count">显示 <span id="showCount">0</span> 条</div>
  <div id="activeFiltersLabel"></div>
</div>

<div id="gridContainer">
  <div class="state-msg">加载中<span class="dot">.</span><span class="dot">.</span><span class="dot">.</span></div>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
  <div class="modal" id="modal">
    <button class="modal-close" onclick="closeModalDirect()">✕</button>
    <div class="modal-id" id="modalId"></div>
    <div class="modal-prompt" id="modalPrompt"></div>
    <div class="modal-meta" id="modalMeta"></div>
  </div>
</div>

<script>
const DATA_URL = "https://raw.githubusercontent.com/bao-lichen/k12-prompt-db/master/data/prompts.json";

let allPrompts = [];
let filters = { subject: null, ability: null, grade: null, search: "" };

async function loadData() {
  try {
    const res = await fetch(DATA_URL + "?t=" + Date.now());
    const json = await res.json();
    allPrompts = json.prompts.filter(p => p.active !== false);
    initFilters();
    render();
    updateMeta(json);
  } catch(e) {
    document.getElementById("gridContainer").innerHTML =
      '<div class="state-msg">数据加载失败，请检查网络连接</div>';
  }
}

function updateMeta(json) {
  const dates = allPrompts.map(p => p.date_added).filter(Boolean).sort();
  document.getElementById("lastUpdate").textContent = dates[dates.length - 1] || "—";
  document.getElementById("totalCount").textContent = allPrompts.length;
}

function initFilters() {
  const subjects = [...new Set(allPrompts.map(p => p.subject))].sort();
  const abilities = [...new Set(allPrompts.map(p => p.ability))];
  const grades    = [...new Set(allPrompts.map(p => p.grade))];

  const abilityOrder = ["解题能力","解析讲解","错误识别","知识问答","指令遵循","安全边界"];
  const gradeOrder   = ["小学","初中","高中"];

  abilities.sort((a, b) => abilityOrder.indexOf(a) - abilityOrder.indexOf(b));
  grades.sort((a, b) => gradeOrder.indexOf(a) - gradeOrder.indexOf(b));

  buildPills("subjectFilters", subjects, "subject");
  buildPills("abilityFilters", abilities, "ability");
  buildPills("gradeFilters",   grades,    "grade");
}

function buildPills(containerId, values, key) {
  const el = document.getElementById(containerId);
  el.innerHTML = '<span class="pill active" data-key="'+key+'" data-val="">全部</span>' +
    values.map(v =>
      `<span class="pill" data-key="${key}" data-val="${v}">${v}</span>`
    ).join("");
  el.addEventListener("click", e => {
    const pill = e.target.closest(".pill");
    if (!pill) return;
    el.querySelectorAll(".pill").forEach(p => p.classList.remove("active"));
    pill.classList.add("active");
    filters[key] = pill.dataset.val || null;
    render();
  });
}

document.getElementById("searchInput").addEventListener("input", e => {
  filters.search = e.target.value.trim();
  render();
});

function getFiltered() {
  return allPrompts.filter(p => {
    if (filters.subject && p.subject !== filters.subject) return false;
    if (filters.ability && p.ability !== filters.ability) return false;
    if (filters.grade   && p.grade   !== filters.grade)   return false;
    if (filters.search) {
      const q = filters.search.toLowerCase();
      if (!p.prompt.toLowerCase().includes(q)) return false;
    }
    return true;
  });
}

function render() {
  const items = getFiltered();
  document.getElementById("showCount").textContent = items.length;

  const active = [filters.subject, filters.ability, filters.grade].filter(Boolean);
  document.getElementById("activeFiltersLabel").textContent =
    active.length ? "筛选：" + active.join(" · ") : "";

  const container = document.getElementById("gridContainer");

  if (items.length === 0) {
    container.innerHTML = '<div class="state-msg">没有符合条件的题目</div>';
    return;
  }

  container.innerHTML = '<div class="grid">' +
    items.map(p => cardHTML(p)).join("") +
    '</div>';

  container.querySelectorAll(".card").forEach((el, i) => {
    el.addEventListener("click", () => openModal(items[i]));
  });
}

function cardHTML(p) {
  const riskClass = p.risk === "正常" ? "risk-normal" : "risk-sensitive";
  return `
    <div class="card">
      <div class="card-id">${p.id}</div>
      <div class="card-prompt">${escHtml(p.prompt)}</div>
      <div class="card-tags">
        <span class="tag subject">${p.subject}</span>
        <span class="tag ability">${p.ability}</span>
        <span class="tag grade">${p.grade}</span>
        <span class="tag ${riskClass}">${p.risk}</span>
      </div>
    </div>`;
}

function openModal(p) {
  document.getElementById("modalId").textContent = p.id;
  document.getElementById("modalPrompt").textContent = p.prompt;
  document.getElementById("modalMeta").innerHTML = [
    ["学科", p.subject],
    ["能力类型", p.ability],
    ["年级段", p.grade],
    ["题型", p.type],
    ["风险等级", p.risk],
    ["来源", p.source],
    ["收录日期", p.date_added],
  ].map(([k, v]) => `
    <div class="modal-meta-item">
      <span class="modal-meta-key">${k}</span>
      <span class="modal-meta-val">${escHtml(v||"—")}</span>
    </div>`).join("");
  document.getElementById("modalOverlay").classList.add("open");
}

function closeModal(e) {
  if (e.target === document.getElementById("modalOverlay")) closeModalDirect();
}
function closeModalDirect() {
  document.getElementById("modalOverlay").classList.remove("open");
}

document.addEventListener("keydown", e => {
  if (e.key === "Escape") closeModalDirect();
});

function escHtml(str) {
  return String(str).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

loadData();
</script>
</body>
</html>
